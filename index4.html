                <header class="Galeria">
                    <h2><span class="material-symbols-outlined">person</span> CORREDOR</h2>
                    <article class="formularioContenedor">
                        <form name="datos_corredor" action="#"> 
                            <section class="filaflex">
                                <section class="campo">
                                    <label for="nombre">Nombre:</label>
                                    <input type="text" id="nombre" placeholder="Nombre"/> 
                                </section>
                                <section class="campo">
                                    <label for="app">Apellido P:</label>
                                    <input type="text" id="app" placeholder="Apellido Paterno"/>

                                    <label for="nac">Nacionalidad:</label>

                            </section>

                            <section class="filaflex">
                                <section class="campo">
                                    <label for="edad">Edad:</label>
                                    <input type="number" id="edad" placeholder="Ej. 26"/> 
                                </section>
                                <fieldset class="campoRadio">
                                    <legend>Género:</legend>
                                    <label><input type="radio" name="genero" value="F"/> Femenino</label>
                                    <label><input type="radio" name="genero" value="M"/> Masculino</label>
                                </fieldset>
                            </section>

                            <section class="filaflex">
                                <section class="campo">
                                    <label for="foto">Foto de Perfil:</label>
                                    <input type="file" id="foto" />
                                </section>
                            </section>

                            <button type="button" id="boton" onclick="guardarCorredor()">
                                <span class="material-symbols-outlined">save</span> Guardar</button>
                        </form>
